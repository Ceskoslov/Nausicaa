[workspace]
members = [
    "crates/app-server",
    "crates/context-fs",
    "crates/executor-process",
    "crates/harness",
    "crates/harness-core",
    "crates/memory",
    "crates/provider-openai",
    "crates/task-ledger",
    "crates/tui",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
agent-harness-app-server = { path = "crates/app-server" }
agent-harness-context-fs = { path = "crates/context-fs" }
agent-harness-core = { path = "crates/harness-core" }
agent-harness-executor-process = { path = "crates/executor-process" }
agent-harness-memory = { path = "crates/memory" }
agent-harness-provider-openai = { path = "crates/provider-openai" }
agent-harness-task-ledger = { path = "crates/task-ledger" }
agent-harness-tui = { path = "crates/tui" }
crossterm = "0.29.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "1.0.69"
